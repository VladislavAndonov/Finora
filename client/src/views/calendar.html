<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/typography.css">
    <link rel="stylesheet" href="../../styles/index.css">
    <link rel="stylesheet" href="../../styles/calendar.css">
</head>

<body>
    <div class="flex-container">
        <aside>
            <div class="profile-details">
                <img class="profile-picture" src="../../public/images/profile-pic.jpg" alt="profile picture">
                <p class="profile-name">Boicho Ognyanov</p>
            </div>

            <ul class="main-nav">
                <li><a class="homeLink current" href="/">Home</a></li>
                <li><a class="expensesLink" href="/expenses">Expenses</a></li>
                <li><a class="incomeLink" href="/income">Income</a></li>
                <li><a class="calendarLink" href="/calendar">Calendar</a></li>
                <li><a class="logoutBtn" href="javascript:void(0)">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="calendar-wrapper">
                <header class="calendar-header">
                    <i class="fa-solid fa-angle-left prev" onclick=showPrevMonth()></i>
                    <h3 class="current-date"></h3>
                    <i class="fa-solid fa-angle-right next" onclick=showNextMonth()></i>
                </header>

                <div class="calendar-body">

                    <ul class="weekdays">
                        <li>Mon</li>
                        <li>Tue</li>
                        <li>Wed</li>
                        <li>Thu</li>
                        <li>Fri</li>
                        <li>Sat</li>
                        <li>Sun</li>
                    </ul>

                    <ul class="dates"></ul>
                </div>
            </div>
            <div>
                <p>transaction-list</p>
            </div>
        </main>
    </div>


    <script src="https://kit.fontawesome.com/2672ae53d6.js" crossorigin="anonymous"></script>
    <script src="calendar.js"></script>

</body>

</html>
